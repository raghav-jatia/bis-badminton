<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BIS Interhouse Badminton 2026–27 — Home</title>
<meta name="description" content="Live results, draws and house standings for the BIS Interhouse Badminton Championship 2026–27.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏸</text></svg>">
<link rel="stylesheet" href="styles.css">
<script src="config.js"></script>
</head>
<body>
<div id="nav-placeholder"></div>
<div class="page-wrap">

  <div id="warnings"></div>

  <div class="hero">
    <div class="hero-label">BIS Interhouse Championship</div>
    <div class="hero-title">Badminton<br>2026–27</div>
    <div class="hero-sub" id="hero-sub">Saturday, 17 October 2026 &nbsp;·&nbsp; NSCI, Worli</div>
  </div>

  <div class="refresh-bar"><span class="live-dot off" id="live-dot"></span><span id="stamp">Connecting…</span></div>

  <div id="notice"></div>

  <div class="section-head first">House Standings</div>
  <div class="scoreboard" id="scoreboard"></div>
  <div class="legend" id="legend"></div>

  <div class="section-head">Schedule <span class="aside">Arrive 20 min before your start time</span></div>
  <div class="sched" id="schedule"></div>

  <div class="section-head">Latest Results <a class="aside" href="draws.html">All draws →</a></div>
  <div class="match-list" id="latest"></div>

  <div class="section-head">Category Results <a class="aside" href="winners.html">Winners →</a></div>
  <div class="res-grid" id="cat-results"></div>

</div>

<script src="seed.js"></script>
<script src="engine.js"></script>
<script src="app.js"></script>
<script>
APP.analytics();
APP.mountNav(null);
var esc = APP.esc;

function render(res) {
  var model = BADM.build(res.data);
  var cfg = model.config;
  APP.mountNav(model);
  APP.stamp(res);
  document.getElementById('warnings').innerHTML = APP.warningsHTML(res, model);
  document.getElementById('hero-sub').innerHTML = esc(cfg.date) + (cfg.venue ? ' &nbsp;·&nbsp; ' + esc(cfg.venue) : '');
  document.getElementById('notice').innerHTML = cfg.notice ? '<div class="notice"><b>Notice:</b> ' + esc(cfg.notice) + '</div>' : '';

  // House standings
  document.getElementById('scoreboard').innerHTML = model.standings.map(function (s) {
    var medal = model.anyPoints ? APP.medal(s.pos) : '';
    var meta = [];
    if (s.gold || s.silver || s.bronze) meta.push('🥇 ' + s.gold + ' &nbsp; 🥈 ' + s.silver + ' &nbsp; 🥉 ' + s.bronze);
    if (model.anyPoints && s.tied) meta.push('Tied');
    return '<div class="score-card sc-' + s.house + (model.anyPoints && s.pos === 1 ? ' leader' : '') + '">' +
      '<div class="sc-medal' + (medal ? '' : ' blank') + '">' + medal + '</div>' +
      '<div class="sc-text"><div class="sc-name h-' + s.house + '">' + s.house + '</div>' +
      (meta.length ? '<div class="sc-meta">' + meta.join(' · ') + '</div>' : '') + '</div>' +
      '<div class="sc-pts h-' + s.house + '">' + s.pts + '</div></div>';
  }).join('');
  var singles = model.categories.filter(function (c) { return c.kind === 'single' && c.state === 'complete'; }).length;
  document.getElementById('legend').innerHTML =
    'Category points: 1st = <b>' + cfg.points[0] + '</b> · 2nd = <b>' + cfg.points[1] + '</b> · 3rd = <b>' + cfg.points[2] + '</b><br>' +
    '<b>' + model.completed + '</b> of ' + model.countable + ' categories complete' +
    (singles ? ' (incl. ' + singles + ' single entr' + (singles === 1 ? 'y' : 'ies') + ')' : '');

  // Schedule — sessions in the order of the Categories tab
  var sessions = [], bySession = {};
  model.categories.forEach(function (c) {
    if (!c.session || c.postponed || c.kind === 'single') return;
    if (!bySession[c.session]) { bySession[c.session] = { time: c.session, until: c.dispersal, cats: [] }; sessions.push(bySession[c.session]); }
    bySession[c.session].cats.push(c);
  });
  var rows = sessions.map(function (s) {
    return '<div class="sched-row"><div class="sched-time"><b>' + esc(s.time) + '</b>' +
      (s.until ? '<span>till ~' + esc(s.until) + '</span>' : '') + '</div>' +
      '<div class="sched-cats">' + s.cats.map(chip).join('') + '</div></div>';
  });
  var post = model.categories.filter(function (c) { return c.postponed; });
  if (post.length) rows.push('<div class="sched-row"><div class="sched-time"><b>TBA</b><span>new date</span></div><div class="sched-cats">' + post.map(chip).join('') + '</div></div>');
  var sing = model.categories.filter(function (c) { return c.kind === 'single' && !c.postponed; });
  if (sing.length) rows.push('<div class="sched-row"><div class="sched-time"><b>—</b><span>no matches</span></div><div class="sched-cats">' + sing.map(chip).join('') + '</div></div>');
  document.getElementById('schedule').innerHTML = rows.join('') || '<div class="empty">Schedule coming soon.</div>';

  // Latest results
  var latest = model.latest.slice(0, 6);
  document.getElementById('latest').innerHTML = latest.length
    ? latest.map(function (m) { return APP.matchCard(m, { showCat: true }); }).join('')
    : '<div class="empty">No results yet — first matches start at 10:00 AM.</div>';

  // Category results grid (schedule order)
  document.getElementById('cat-results').innerHTML = model.categories.map(function (c) {
    var body;
    if (c.podium.length && c.state === 'complete') {
      body = c.podium.map(function (p) {
        return '<div class="pod-line"><span class="md">' + APP.medal(p.pos) + '</span><span class="nm">' + APP.pname(p.player) + '</span>' +
          (p.player.house ? '' : APP.houseTag('')) + '<span class="pt">+' + p.pts + '</span></div>';
      }).join('');
      if (c.kind === 'single') body += '<div class="res-sub">Single entry — winner by walkover</div>';
    } else if (c.state === 'progress') {
      body = '<div class="res-sub">' + c.played + ' of ' + c.total + ' matches played</div>';
    } else if (c.state === 'postponed') {
      body = '<div class="res-sub">' + esc(c.note || 'Postponed — new date to be announced') + '</div>';
    } else if (c.state === 'single') {
      body = '<div class="res-sub">Single entry: ' + APP.pname(c.players[0]) + '</div>';
    } else {
      body = '<div class="res-sub">' + (c.session ? 'Starts ' + esc(c.session) : 'Upcoming') + ' · ' + c.players.length + ' players</div>';
    }
    return '<a class="res-item ' + c.state + '" href="draws.html#' + APP.catSlug(c.name) + '">' +
      '<div class="res-head"><span class="res-cat">' + esc(c.name) + '</span>' + APP.stateBadge(c) + '</div>' + body + '</a>';
  }).join('');
}

function chip(c) {
  var badge = c.state === 'progress' ? '<span class="status-badge st-progress">' + c.played + '/' + c.total + '</span>'
            : c.state === 'complete' ? '<span class="status-badge st-completed">' + (c.kind === 'single' ? 'W/O' : 'Done') + '</span>'
            : c.state === 'postponed' ? '<span class="status-badge st-postponed">Postponed</span>'
            : '';
  return '<a class="cat-chip" href="draws.html#' + APP.catSlug(c.name) + '">' + esc(c.name) + badge + '</a>';
}

APP.autoRefresh(render);
</script>
</body>
</html>
