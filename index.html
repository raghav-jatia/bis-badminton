<body>

            <path d="M-24 -118H24M-24 -112H24M-24 -106H24M-24 -100H24M-24 -94H24M-24 -88H24M-24 -82H24M-24 -76H24M-24 -70H24M-24 -64H24M-24 -58H24"/>
          </g>
          <ellipse cx="0" cy="-88" rx="27" ry="36" fill="none" stroke="#FFFFFF" stroke-width="5"/>

      <use href="#rk" transform="translate(120 154) rotate(30)"/>

  <div class="scoreboard" id="scoreboard"></div>
  <div class="legend" id="legend"></div>

  <div class="section-head">Latest Results <a class="aside" href="draws.html">All draws →</a></div>
  <div class="match-list" id="latest"></div>

  <div class="section-head">Category Results <a class="aside" href="winners.html">Winners →</a></div>
  <div class="res-grid" id="cat-results"></div>

</div>

<script src="seed.js"></script>
<script src="engine.js"></script>
<script src="app.js"></script>
<script>
APP.analytics();
APP.mountNav(null);
var esc = APP.esc;

function render(res) {
  var model = BADM.build(res.data);
  var cfg = model.config;
  APP.mountNav(model);
  APP.stamp(res, model);
  document.getElementById('warnings').innerHTML = APP.warningsHTML(res, model);
  document.getElementById('hero-sub').innerHTML = esc(cfg.date) + (cfg.venue ? ' &nbsp;·&nbsp; ' + esc(cfg.venue) : '');
  document.getElementById('notice').innerHTML = cfg.notice ? '<div class="notice"><b>Notice:</b> ' + esc(cfg.notice) + '</div>' : '';

  // House standings - medal once points exist, otherwise a star in the house colour
  document.getElementById('scoreboard').innerHTML = model.standings.map(function (s) {
    var badge = model.anyPoints ? APP.medal(s.pos) : '<span class="h-' + s.house + '">★</span>';
    var meta = [];
    if (s.gold || s.silver || s.bronze) meta.push('🥇 ' + s.gold + ' &nbsp; 🥈 ' + s.silver + ' &nbsp; 🥉 ' + s.bronze);
    if (model.anyPoints && s.tied) meta.push('Tied');
    return '<div class="score-card sc-' + s.house + (model.anyPoints && s.pos === 1 ? ' leader' : '') + '">' +
      '<div class="sc-medal">' + badge + '</div>' +
      '<div class="sc-text"><div class="sc-name h-' + s.house + '">' + s.house + '</div>' +
      (meta.length ? '<div class="sc-meta">' + meta.join(' · ') + '</div>' : '') + '</div>' +
      '<div class="sc-pts h-' + s.house + '">' + s.pts + '</div></div>';
  }).join('');
  document.getElementById('legend').innerHTML =
    'Category points: 1st = <b>' + cfg.points[0] + '</b> · 2nd = <b>' + cfg.points[1] + '</b> · 3rd = <b>' + cfg.points[2] + '</b><br>' +
    '<b>' + model.completed + '</b> of ' + model.countable + ' categories complete';

  // Latest results
  var latest = model.latest.slice(0, 3);
  document.getElementById('latest').innerHTML = latest.length
    ? latest.map(function (m) { return APP.matchCard(m, { showCat: true }); }).join('')
    : '<div class="empty">No results yet - first matches start at 10:00 AM.</div>';

  // Category results (schedule order)
  document.getElementById('cat-results').innerHTML = model.categories.map(function (c) { return APP.catTile(c, false); }).join('');
}

APP.autoRefresh(render);
</script>
</body>
</html>
